version: "3"

tasks:
  build:
    desc: Build Next.js with compile mode (default)
    cmds:
      - task: build:compile
  build:compile:
    desc: Build Next.js with experimental compile mode
    cmds:
      - NODE_ENV=production bun --bun --disable-transpile next build --experimental-build-mode=compile
  build:generate:
    desc: Build Next.js with experimental generate mode
    cmds:
      - NODE_ENV=production bun --bun --disable-transpile next build --experimental-build-mode=generate
  build:default:
    desc: Build Next.js with default mode
    cmds:
      - NODE_ENV=production bun --bun --disable-transpile next build
  codegen:
    desc: Run CMS + frontend generators (Payload + Next + GraphQL types)
    cmds:
      - bun run p:cli generate:types
      - bun run p:cli generate:importmap
      - bunx cross-env PAYLOAD_CONFIG_PATH=src/payload.config.ts bunx --bun payload-graphql --disable-transpile generate:schema
      - bun run p:cli generate:db-schema
      - bunx next typegen
      - bunx graphql-codegen --config codegen.ts
      - task: fix

  codegen:check:
    desc: Run codegen and fail if it changes the working tree
    cmds:
      - task: codegen
      - |
        if [ -n "$(git status --porcelain)" ]; then
          echo "Codegen changed files:"
          git status --short
          exit 1
        fi

  fix:
    desc: Auto-fix lint issues
    cmds:
      - bunx biome check --write --unsafe .
  migrate:create:
    cmds:
      - bun run p:cli migrate:create --skip-empty
  migrate:is-up-to-date:
    cmds:
      - bun run p:cli migrate:create --check
  lint:
    desc: Lint sources
    cmds:
      - bunx biome check .
  typegen:
    desc: Generate Next.js type metadata (needed for build validation)
    cmds:
      - bunx next typegen
  typecheck:
    desc: Run TypeScript typecheck
    cmds:
      - bunx tsc --noEmit

  validate:
    desc: Run lint + typecheck in parallel
    deps:
      - lint
      - typecheck

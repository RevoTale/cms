name: "revotale_cms_devcontainer"

services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/go:2.1-1.26-trixie
    command: sleep infinity
    depends_on:
      cms_postgres:
        condition: service_started
      rustfs:
        condition: service_started
      imgproxy:
        condition: service_started
    environment:
      APP_URL: http://${LOCAL_DOMAIN}:${CMS_PUBLIC_PORT}
      NEXT_PUBLIC_SERVER_URL: http://${LOCAL_DOMAIN}:${CMS_PUBLIC_PORT}
      PAYLOAD_PUBLIC_SERVER_URL: http://${LOCAL_DOMAIN}:${CMS_PUBLIC_PORT}
      GRAPHQL_URL: http://${LOCAL_DOMAIN}:${CMS_PUBLIC_PORT}/api/graphql
      GRAPHQL_SERVER_URL: http://devcontainer:3000/api/graphql
      PAYLOAD_AUTH_COOKIE_DOMAIN: ${LOCAL_DOMAIN}
      DATABASE_URI: postgresql://${CMS_DB_USER}:${CMS_DB_PASSWORD}@${CMS_DB_HOST}:5432/${CMS_DB_NAME}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PUBLIC_DRAFT_SECRET: ${PAYLOAD_PUBLIC_DRAFT_SECRET}
      NEXT_PRIVATE_DRAFT_SECRET: ${NEXT_PRIVATE_DRAFT_SECRET}
      REVALIDATION_KEY: ${REVALIDATION_KEY}
      NEXT_PRIVATE_REVALIDATION_KEY: ${NEXT_PRIVATE_REVALIDATION_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_REGION: ${S3_REGION}
      ENABLE_CRON: ${ENABLE_CRON}
      NEXT_PUBLIC_IS_LIVE: ${NEXT_PUBLIC_IS_LIVE}
    networks:
      - cms_net
    volumes:
      - ..:/workspaces/cms
    working_dir: /workspaces/cms

  cms_postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    command:
      - postgres
      - -c
      - log_min_messages=WARNING
    environment:
      POSTGRES_USER: ${CMS_DB_USER}
      POSTGRES_PASSWORD: ${CMS_DB_PASSWORD}
      POSTGRES_DB: ${CMS_DB_NAME}
    networks:
      - cms_net
    restart: unless-stopped
    volumes:
      - cms_postgres_data:/var/lib/postgresql

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.6@sha256:e620d37756fff072b10bf648c7bb9d370d7e91a928b7e6a5e1ac85bdfb4e4dab
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      RUSTFS_OBS_LOGGER_LEVEL: info
    networks:
      - cms_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs

  setup-rustfs:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      rustfs:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - |
        until mc alias set local ${S3_ENDPOINT} ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY}; do sleep 2; done
        until mc mb --ignore-existing local/${S3_BUCKET}; do sleep 2; done
        mc anonymous set download local/${S3_BUCKET} || true
    networks:
      - cms_net
    restart: "no"

  imgproxy:
    image: ghcr.io/revotale/infrastructure-imgproxy:0.0.20@sha256:b876d6788d59e19f770b213b310d990dcacea31ea03f453bf8b7d4ce1806948f
    environment:
      IMGPROXY_ALLOWED_SOURCES: http://devcontainer:3000/,http://rustfs:9000/
    networks:
      - cms_net
    restart: unless-stopped

  proxy:
    image: nginx:1.31-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    depends_on:
      devcontainer:
        condition: service_started
      imgproxy:
        condition: service_started
    networks:
      - cms_net
    ports:
      - "${CMS_PUBLIC_PORT}:80"
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  cms_net:
    driver: bridge

volumes:
  cms_postgres_data:
  rustfs_data:
  rustfs_logs:

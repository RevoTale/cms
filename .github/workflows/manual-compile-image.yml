name: Manual CMS Production Image

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Next build mode"
        required: true
        type: choice
        default: compile
        options:
          - compile
          - default
          - generate

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - name: Build image tags
        id: tags
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          latest_tag="$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags | head -n 1)"
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:latest"
            if [ -n "$latest_tag" ] && [ "$latest_tag" != "latest" ]; then
              echo "${IMAGE_NAME}:${latest_tag}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            NEXT_BUILD_MODE=${{ inputs.build_mode }}

version: "3"

tasks:
  codegen:
    desc: Run CMS generators (types/importmap/schema/db-schema)
    cmds:
      - bun run p:cli generate:types
      - bun run p:cli generate:importmap
      - bun run payload-graphql --disable-transpile generate:schema
      - bun run p:cli generate:db-schema

  codegen:check:
    desc: Run codegen and fail if it changes the working tree
    cmds:
      - task: codegen
      - |
        if [ -n "$(git status --porcelain)" ]; then
          echo "Codegen changed files:"
          git status --short
          exit 1
        fi

  fix:
    desc: Auto-fix lint issues
    cmds:
      - bunx eslint --fix .

  lint:
    desc: Lint sources
    cmds:
      - bunx eslint .

  typecheck:
    desc: Run TypeScript typecheck
    cmds:
      - bunx tsc --noEmit

  validate:
    desc: Run lint + typecheck in parallel
    deps:
      - lint
      - typecheck

when:
  - event: [push, pull_request]
    branch: main
  - event: [manual, release]

steps:
  - name: checks
    image: node:25.9.0-bookworm@sha256:78839ac448c23517f8eab2e8f7943d9b4f73979eb7f8bed2c73dbf72ff869e7b
    environment:
      ROOT_WEBSITE_URL: https://revotale.com
    commands:
      - npm install --global pnpm@11.23.0 @go-task/cli@3.54.0
      - pnpm install --frozen-lockfile
      - task typegen
      - task validate
      - task codegen:check
